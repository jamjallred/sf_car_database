<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory · SF Car Database</title>
  <link rel="stylesheet" href="/app/static/css/app.css">
  <script src="/app/static/js/common.js" defer></script>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main>
    <div class="page-head">
      <h1>Inventory</h1>
      <p>Search by VIN, make, model or city. To look up exact VINs, paste several separated by commas.</p>
    </div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search VIN, make, model, city…  or paste VIN1, VIN2" autocomplete="off">
      <select id="state"><option value="">All states</option></select>
      <select id="limit">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="250">250 / page</option>
      </select>
      <span class="count" id="count"></span>
    </div>

    <div class="table-wrap">
      <table id="cars">
        <thead><tr></tr></thead>
        <tbody><tr><td class="empty">Loading…</td></tr></tbody>
      </table>
    </div>

    <div class="pager">
      <button class="btn secondary" id="prev" type="button">← Prev</button>
      <span id="page-info"></span>
      <button class="btn secondary" id="next" type="button">Next →</button>
    </div>
    <div class="status" id="inv-status" role="status"></div>
  </main>
  <script src="/app/static/js/inventory.js" defer></script>
</body>
</html>
