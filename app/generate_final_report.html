<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Final report · SF Car Database</title>
  <link rel="stylesheet" href="/app/static/css/app.css">
  <script src="/app/static/js/common.js" defer></script>
</head>
<body>
  <header id="topbar" class="topbar"></header>
  <main class="narrow">
    <div class="page-head">
      <h1>Final report</h1>
      <p>Unclaimed cars are removed, and a <strong>FINAL</strong> column shows the rep who closed each car, or <em>MISSED</em> if it went to someone else.</p>
    </div>

    <form class="card" data-endpoint="/api/generate_final_report" data-busy="Generating…" data-fallback-name="final_report.xlsx" novalidate>
      <div class="field-group">
        <span class="field">Dibs sheet</span>
      <label class="dropzone" data-label="the dibs sheet">
        <input type="file" name="dibs" accept=".xlsx" required>
        <span class="dz-icon"></span>
        <span class="dz-text">
          <span class="dz-title">Drop the dibs sheet here</span>
          <span class="dz-hint">or click to browse · .xlsx</span>
        </span>
      </label>
      </div>
      <div class="field-group">
        <span class="field">Auction results</span>
      <label class="dropzone" data-label="the results CSV">
        <input type="file" name="initial" accept=".csv" required>
        <span class="dz-icon"></span>
        <span class="dz-text">
          <span class="dz-title">Drop the results CSV here</span>
          <span class="dz-hint">or click to browse · .csv</span>
        </span>
      </label>
      </div>
      <div class="actions"><button class="btn" type="submit"><span class="spinner"></span><span class="label">Generate final report</span></button></div>
      <div class="status" role="status"></div>
    </form>
  </main>
</body>
</html>
